<!DOCTYPE html>
<html lang="en" data-theme="galaxy">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ludo Raja 🇳🇵 — Premium Multiplayer Board Game</title>
  <meta name="description" content="Play premium Ludo Raja with friends. Classic and Galaxy themes, AI bots, real-time multiplayer."/>
  <link rel="icon" type="image/png" href="/favicon.png"/>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="stylesheet" href="css/lobby.css"/>
</head>
<body>
  <div class="stars-bg" id="stars-bg"></div>
  <button class="vol-toggle" id="vol-toggle" title="Toggle Sound">🔊</button>

  <div class="lobby-root">
    <header class="lobby-header">
      <div class="lobby-logo">
        Ludo Raja
        <span class="waving-flag-container">
          <svg class="nepal-flag-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
            <defs>
              <clipPath id="np-a">
                <path fill-opacity=".7" d="M0-16h512v512H0z"/>
              </clipPath>
              <filter id="wave-filter">
                <feTurbulence type="fractalNoise" baseFrequency="0.015625 0.0416667" numOctaves="2" stitchTiles="stitch" width="640" height="480" result="noise" />
                <feOffset dx="0" dy="0" result="movedNoise">
                  <animate attributeName="dx" from="0" to="640" dur="4s" repeatCount="indefinite" />
                </feOffset>
                <feDisplacementMap in="SourceGraphic" in2="movedNoise" scale="35" xChannelSelector="R" yChannelSelector="G" />
              </filter>
              <linearGradient id="pole-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#555" />
                <stop offset="50%" stop-color="#ccc" />
                <stop offset="100%" stop-color="#333" />
              </linearGradient>
              <radialGradient id="gold-ball-grad" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#fff" />
                <stop offset="30%" stop-color="#ffd700" />
                <stop offset="100%" stop-color="#b8860b" />
              </radialGradient>
            </defs>
            <g clip-path="url(#np-a)" transform="translate(20 15)scale(.9)" filter="url(#wave-filter)">
              <g fill-rule="evenodd">
                <path fill="#ce0000" stroke="#000063" stroke-width="13.8" d="M6.5 489.5h378.8L137.4 238.1l257.3.3L6.6-9.5v499z"/>
                <path fill="#fff" d="m180.7 355.8-27 9 21.2 19.8-28.5-1.8 11.7 26.2-25.5-12.3.5 28.6-18.8-20.9-10.7 26.6-9.2-26.3-20.3 20.6 1.8-27.7L49 409l12.6-25-29.3.6 21.5-18.3-27.3-10.5 27-9L32.2 327l28.4 1.8L49 302.6l25.6 12.3-.5-28.6 18.8 20.9 10.7-26.6 9.1 26.3 20.4-20.6-1.9 27.7 27-11.4-12.7 25 29.4-.6-21.5 18.3zm-32.4-184.7-11.3 8.4 5.6 4.6a94 94 0 0 0 30.7-36c1.8 21.3-17.7 69-68.7 69.5a70.6 70.6 0 0 1-71.5-70.3c10 18.2 16.2 27 32 36.5l4.7-4.4-10.6-8.9 13.7-3.6-7.4-12.4 14.4 1-1.8-14.4 12.6 7.4 4-13.5 9 10.8 8.5-10.3 4.6 14 11.8-8.2-1.5 14.3 14.2-1.7-6.7 13.2z"/>
              </g>
            </g>
            <rect x="12" y="10" width="8" height="465" rx="3" fill="url(#pole-grad)" />
            <circle cx="16" cy="10" r="8" fill="url(#gold-ball-grad)" />
          </svg>
        </span>
      </div>
      <div class="lobby-subtitle">Premium Multiplayer</div>
    </header>

    <div class="lobby-card glass">
      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" id="tab-create" onclick="switchTab('create')">Create Game</button>
        <button class="tab" id="tab-join" onclick="switchTab('join')">Join Game</button>
      </div>

      <!-- CREATE GAME -->
      <div class="form-section active" id="section-create">
        <!-- Theme Selector -->
        <div class="form-group">
          <label class="form-label">Board Theme</label>
          <div class="theme-selector">
            <div class="theme-option selected" id="theme-galaxy" onclick="selectTheme('galaxy')">
              <div class="theme-icon">🌌</div>
              <div class="theme-name">Galaxy</div>
              <div class="theme-desc">Neon glow · Dark space</div>
            </div>
            <div class="theme-option" id="theme-classic" onclick="selectTheme('classic')">
              <div class="theme-icon">♟️</div>
              <div class="theme-name">Classic</div>
              <div class="theme-desc">Warm wood · Jewel tones</div>
            </div>
          </div>
        </div>

        <!-- Your Name -->
        <div class="form-group">
          <label class="form-label" for="create-name">Your Name</label>
          <input class="input" type="text" id="create-name" placeholder="Enter your name…" maxlength="20" autocomplete="off"/>
        </div>

        <!-- Your Color -->
        <div class="form-group">
          <label class="form-label">Your Color</label>
          <div class="color-grid">
            <div class="color-option red selected" data-color="red" onclick="selectColor('red')">🔴</div>
            <div class="color-option blue" data-color="blue" onclick="selectColor('blue')">🔵</div>
            <div class="color-option green" data-color="green" onclick="selectColor('green')">🟢</div>
            <div class="color-option yellow" data-color="yellow" onclick="selectColor('yellow')">🟡</div>
          </div>
        </div>

        <!-- Player Slots -->
        <div class="form-group">
          <label class="form-label">Player Slots</label>
          <div class="slots-config" id="slots-config"></div>
          <button class="add-slot-btn" id="add-slot-btn" onclick="addSlot()">+ Add Player Slot</button>
        </div>

        <button class="btn btn-primary btn-lg" style="width:100%" onclick="createGame()">
          🎲 Create Room
        </button>
      </div>

      <!-- JOIN GAME -->
      <div class="form-section" id="section-join">
        <div class="form-group">
          <label class="form-label" for="join-name">Your Name</label>
          <input class="input" type="text" id="join-name" placeholder="Enter your name…" maxlength="20" autocomplete="off"/>
        </div>

        <div class="form-group">
          <label class="form-label" for="join-code">Room Code</label>
          <input class="input" type="text" id="join-code" placeholder="Enter 6-letter code…" maxlength="6"
            style="letter-spacing:6px; font-family:'Orbitron',monospace; font-size:1.2rem; text-transform:uppercase"
            autocomplete="off"/>
        </div>

        <div class="form-group">
          <label class="form-label">Your Color</label>
          <div class="color-grid" id="join-color-grid">
            <div class="color-option red selected" data-color="red" onclick="selectJoinColor('red')">🔴</div>
            <div class="color-option blue" data-color="blue" onclick="selectJoinColor('blue')">🔵</div>
            <div class="color-option green" data-color="green" onclick="selectJoinColor('green')">🟢</div>
            <div class="color-option yellow" data-color="yellow" onclick="selectJoinColor('yellow')">🟡</div>
          </div>
        </div>

        <!-- Last game result for this room code -->
        <div id="room-history-card" style="display:none"></div>

        <button class="btn btn-primary btn-lg" style="width:100%" onclick="joinGame()">
          🚪 Join Room
        </button>
      </div>
    </div>

    <!-- Waiting Room (hidden until room created/joined) -->
    <div id="waiting-room" style="display:none; width:100%; max-width:560px; margin-top:16px;" class="animate-fade-in">
      <div class="lobby-card glass">
        <div class="room-code-display" onclick="copyRoomCode()" style="cursor:pointer" title="Tap to copy">
          <div class="room-code-label">Room Code — Share with friends</div>
          <div class="room-code-value" id="display-room-code">------</div>
          <div class="room-code-copy">📋 Tap to copy</div>
        </div>

        <div class="form-group">
          <label class="form-label">Players in Room</label>
          <div class="players-list" id="players-list"></div>
        </div>

        <button class="btn btn-primary btn-lg" style="width:100%;display:none" id="start-btn" onclick="startGame()" disabled>
          ⚔️ Start Game
        </button>
        <div style="text-align:center; margin-top:10px; font-size:0.8rem; color:var(--text-muted)" id="start-hint">
          Waiting for players…
        </div>
        <button class="btn btn-ghost btn-sm" style="width:100%; margin-top: 15px;" id="leave-btn" onclick="leaveRoom()">
          ← Leave Room
        </button>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/socket-client.js"></script>
  <script src="js/lobby.js"></script>
</body>
</html>
